<svg xmlns="http://www.w3.org/2000/svg" width="900" height="275" viewBox="0 0 900 275" role="img" aria-labelledby="title desc">
  <title id="title">Campus Safety Issue Reporter wireframe</title>
  <desc id="desc">Mobile and tablet stack the report form and tracking panel. Desktop places them side by side.</desc>
  <style>
    text { font: 14px system-ui, sans-serif; fill: #143d3b; text-anchor: middle; }
    .label { font-weight: 700; }
    .frame { fill: #f1f7f6; stroke: #5e817e; rx: 8; }
    .block { fill: #fff; stroke: #90aaa7; rx: 4; }
    .bar { fill: #cbe2de; rx: 4; }
  </style>
  <rect width="900" height="275" fill="white"/>
  <g transform="translate(22,0)">
    <text class="label" x="85" y="30">Mobile</text>
    <rect class="frame" x="0" y="46" width="170" height="205"/>
    <rect class="bar" x="9" y="56" width="152" height="30"/>
    <text x="85" y="76">Page heading</text>
    <rect class="block" x="9" y="96" width="152" height="57"/>
    <text x="85" y="130">Report form</text>
    <rect class="block" x="9" y="163" width="152" height="78"/>
    <text x="85" y="196">Tracking ID</text>
    <text x="85" y="220">Status result</text>
  </g>
  <g transform="translate(219,0)">
    <text class="label" x="130" y="30">Tablet</text>
    <rect class="frame" x="0" y="46" width="260" height="205"/>
    <rect class="bar" x="9" y="56" width="242" height="30"/>
    <text x="130" y="76">Page heading</text>
    <rect class="block" x="9" y="96" width="242" height="57"/>
    <text x="130" y="130">Report form</text>
    <rect class="block" x="9" y="163" width="242" height="78"/>
    <text x="130" y="189">Tracking ID</text>
    <rect class="bar" x="19" y="202" width="222" height="28"/>
    <text x="130" y="221">Status result</text>
  </g>
  <g transform="translate(506,0)">
    <text class="label" x="185" y="30">Desktop</text>
    <rect class="frame" x="0" y="46" width="370" height="205"/>
    <rect class="bar" x="9" y="56" width="352" height="30"/>
    <text x="185" y="76">Page heading</text>
    <rect class="block" x="9" y="96" width="128" height="145"/>
    <text x="73" y="155">Report form</text>
    <rect class="block" x="147" y="96" width="214" height="145"/>
    <text x="254" y="131">Tracking ID</text>
    <rect class="bar" x="157" y="145" width="194" height="34"/>
    <text x="254" y="167">Status result</text>
  </g>
</svg>
